# ETM-over-SWO setup for STM32F429 via ST-Link + OpenOCD.
# Equivalent of the J-Link etm_2m_forever.jlink: configures TPIU(NRZ,
# formatter-on) + ETMv3.5 (br_out=0, stall) for SWO on PB3 @ 2 MHz, then
# resumes the CPU and KEEPS the OpenOCD session open so output is continuous
# (OpenOCD stays resident -> CPU runs forever, like J-Link's long sleep).
#
# Capture PB3 with CH343/logic analyzer (NRZ/UART, 2 Mbaud, 8N1, LSB-first).
#
# Run:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg \
#           -f etm_swo_openocd.cfg
# (leave it running; Ctrl-C to stop)
#
# Notes:
#  - ST-Link uses hla_swd transport: only mdw/mww (mem access) are used here.
#  - Firmware sets its own 168 MHz PLL; we let it boot then configure trace.
#  - "init" brings up the target; the rest runs at config-script load time.

init

# Let firmware boot and bring up its 168 MHz PLL
reset run
sleep 500
halt

echo "RCC_CFGR (expect 0x....940A = PLL):"
mdw 0x40023808

# ---- Trace enable (DEMCR.TRCENA) ----
mww 0xE000EDFC 0x01000000

# ---- PB3 = AF0 SWO (firmware doesn't use GPIOB) ----
mww 0x40023830 0x00100002
mww 0x40020400 0x00000280
mww 0x40020408 0x000000C0
mww 0x40020420 0x00000000
mww 0xE0042004 0x00000027

# ---- TPIU: NRZ, formatter ON, 168MHz/2MHz -> ACPR = 83 ----
mww 0xE0040FB0 0xC5ACCE55
mww 0xE0040010 0x00000053
mww 0xE00400F0 0x00000002
mww 0xE0040304 0x00000102

# ---- DWT: cyccnt + sync ----
mww 0xE0001FB0 0xC5ACCE55
mww 0xE0001000 0x40000C01

# ---- ITM bus ID 1 (sync source) ----
mww 0xE0000FB0 0xC5ACCE55
mww 0xE0000E80 0x0001000D

# ---- ETMv3.5: br_out=0, stall=1 ----
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041000 0x00000400
mww 0xE0041200 0x00000002
mww 0xE0041008 0x0000406F
mww 0xE0041020 0x0000006F
mww 0xE0041024 0x20000001
mww 0xE004102C 0x00000008
mww 0xE004101C 0x00000000
mww 0xE0041000 0x00000C80
mww 0xE0041000 0x00000880

echo "ETM_CR (expect 0x00000880):"
mdw 0xE0041000
echo "TPIU_FFCR (expect 0x00000102):"
mdw 0xE0040304
echo "TPIU_ACPR (expect 0x00000053):"
mdw 0xE0040010

# Resume and stay resident -> continuous SWO output on PB3
resume
echo "=== ETM-over-SWO running. PB3 @ 2 Mbaud NRZ. Ctrl-C to stop. ==="

# ====================================================================
# GOTCHA: SWO output STOPS the moment this OpenOCD session exits.
# --------------------------------------------------------------------
# The debugger session is a PREREQUISITE for continuous SWO output:
#   - On exit/Ctrl-C, OpenOCD's shutdown sequence (under hla_swd / ST-Link)
#     halts the core and/or releases the target; once the CPU stops it no
#     longer executes instructions, so the ETM/SWO stream dies immediately.
#   - This is the same class of pitfall as J-Link's "exit halts the CPU".
#   - Therefore you MUST keep OpenOCD running for the whole capture window
#     (this script stays resident after `resume`). Do NOT add `shutdown`.
#
# The 'resume' below leaves the CPU running while OpenOCD is alive. The
# pre_shutdown hook tries a best-effort resume so the core keeps running
# even after OpenOCD detaches, but note: with hla_swd this is NOT reliable
# (ST-Link may still reset/halt on disconnect). Treat "OpenOCD alive" as a
# hard requirement for capture, not an optimisation.
# ====================================================================
proc pre_shutdown {} {
    catch { resume }
}

