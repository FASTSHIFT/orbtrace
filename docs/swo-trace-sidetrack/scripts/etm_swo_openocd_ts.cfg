# ETM-over-SWO setup for STM32F429 via ST-Link + OpenOCD — CYCLE-ACCURATE variant.
#
# Same as etm_swo_openocd.cfg (NRZ, formatter-on, 2 MHz, br_out=0, stall, dense
# sync) BUT with ETM cycle-accurate tracing ENABLED (ETM_CR bit12). This makes
# the ETM stream carry cycle-count packets so a decoder (orbetto/Mortrall) can
# build a real time axis from the trace itself — the plain config emits ZERO
# time packets (verified: timestamp/cyccnt/isync_cyc all 0), collapsing
# orbetto's time axis to ~0.
#
# Caveats (sidetrack §16.6): ETMv3.5 is NOT cycle-accurate through FIFO overflow,
# and cycle-accurate adds bandwidth. With stall on + small proj_add loop this is
# expected to stay clean. If overflow corrupts counts, fall back to FPGA time (-F).
#
# Run:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg \
#           -f etm_swo_openocd_cyc.cfg
# (leave it running; Ctrl-C to stop)

init

# Let firmware boot and bring up its 168 MHz PLL
reset run
sleep 500
halt

echo "RCC_CFGR (expect 0x....940A = PLL):"
mdw 0x40023808

# ---- Trace enable (DEMCR.TRCENA) ----
mww 0xE000EDFC 0x01000000

# ---- PB3 = AF0 SWO (firmware doesn't use GPIOB) ----
mww 0x40023830 0x00100002
mww 0x40020400 0x00000280
mww 0x40020408 0x000000C0
mww 0x40020420 0x00000000
mww 0xE0042004 0x00000027

# ---- TPIU: NRZ, formatter ON, 168MHz/2MHz -> ACPR = 83 ----
mww 0xE0040FB0 0xC5ACCE55
mww 0xE0040010 0x00000053
mww 0xE00400F0 0x00000002
mww 0xE0040304 0x00000102

# ---- DWT: cyccnt + FREQUENT sync (densify TPIU frame-sync) ----
mww 0xE0001FB0 0xC5ACCE55
mww 0xE0001000 0x40000401

# ---- ITM bus ID 1 (sync source) ----
mww 0xE0000FB0 0xC5ACCE55
mww 0xE0000E80 0x0001000D

# ---- ETMv3.5: br_out=0, stall=1, TIMESTAMP=1 (bit28) ----
# bit12 (cycle-accurate) is HARDWIRED 0 on Cortex-M4 ETM-M4 (verified: writes
# to 0x1880 read back 0x880). But bit28 (timestamp enable) IS writable
# (sidetrack §15.4: ETMv3.5 supports timestamps via ETMCR bit28 + ETMTSEVR).
# So we enable timestamp packets instead of cycle-accurate.
#   prog: 0x0C80 -> 0x10000C80
#   run : 0x0880 -> 0x10000880
mww 0xE0041FB0 0xC5ACCE55
mww 0xE0041000 0x00000400
mww 0xE0041200 0x00000002
# ETMSYNCFR: dense ETM I-sync (256 bytes)
mww 0xE0041008 0x00000100
mww 0xE0041020 0x0000006F
mww 0xE0041024 0x20000001
mww 0xE004102C 0x00000008
mww 0xE004101C 0x00000000
# ETMTSEVR (0xE0041078 / reg 0x1E): timestamp event. Resource 0x6F = "always
# true" so a timestamp packet is emitted at every trace-sync boundary.
mww 0xE0041078 0x0000006F
mww 0xE0041000 0x10000C80
mww 0xE0041000 0x10000880

echo "ETM_CR (expect 0x10000880 = timestamp enabled):"
mdw 0xE0041000
echo "TPIU_FFCR (expect 0x00000102):"
mdw 0xE0040304
echo "TPIU_ACPR (expect 0x00000053):"
mdw 0xE0040010

# Resume and stay resident -> continuous SWO output on PB3
resume
echo "=== ETM-over-SWO (CYCLE-ACCURATE) running. PB3 @ 2 Mbaud NRZ. Ctrl-C to stop. ==="

proc pre_shutdown {} {
    catch { resume }
}
