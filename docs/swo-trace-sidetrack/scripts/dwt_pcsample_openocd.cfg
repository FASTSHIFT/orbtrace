# DWT PC-sampling over SWO for STM32F429 (ST-Link + OpenOCD).
#
# r21 Q5 path: instead of streaming the full ETM instruction flow (which the
# P-header backbone makes ~as wide as full-speed regardless of br_out), DWT
# periodically samples the PC and emits it as an ITM hardware-source packet.
# Bandwidth is tiny (KB/s), needs NO stall, and SWO single-wire suffices.
# orbuculum/orbtop consume PC samples natively (MSG_PC_SAMPLE / HWEVENT_PCSample,
# `dwtSamplePC` in gdbtrace.init) -- NO wheel reinvention.
#
# This is ITM (formatter BYPASS), NOT ETM. ETM and ITM cannot share SWO with
# formatter-on on this Simple TPIU (sidetrack 15), so PC-sampling is its own
# capture mode: profiling/hot-spots, not full control flow.
#
# Register bits replicated from orbuculum Support/gdbtrace.init:
#   DWT_CTRL (0xE0001000): bit12 PCSAMPLENA, bit9 POSTTAP (CYCCNT[6]/[10]),
#     bits[11:10] SYNCTAP, bits[8:5] POSTPRESET, bit0 CYCCNTENA.
#
# Run:
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg \
#           -f dwt_pcsample_openocd.cfg
# Then capture PB3 SWO (NRZ 2 Mbaud) and feed orbuculum:
#   orbuculum -s <bridge> -a 2000000        (ITM, no -T)
#   orbtop -s localhost:3402 -e proj_add.axf

init
reset run
sleep 500
halt

# ---- Trace enable (DEMCR.TRCENA) ----
mww 0xE000EDFC 0x01000000

# ---- PB3 = AF0 SWO ----
mww 0x40023830 0x00100002
mww 0x40020400 0x00000280
mww 0x40020408 0x000000C0
mww 0x40020420 0x00000000
mww 0xE0042004 0x00000027

# ---- TPIU: NRZ, formatter BYPASS (ITM only), 168MHz/2MHz -> ACPR=83 ----
mww 0xE0040FB0 0xC5ACCE55
mww 0xE0040010 0x00000053
mww 0xE00400F0 0x00000002
mww 0xE0040304 0x00000100

# ---- ITM: unlock, enable, TraceBusID=1, enable TS + sync, all stimulus ----
mww 0xE0000FB0 0xC5ACCE55
# ITM_TCR: ITMENA(0) TSENA(1) SYNCENA(2) TXENA(3) bus id<<16 | TSprescale
mww 0xE0000E80 0x0001000F
mww 0xE0000E00 0xFFFFFFFF

# ---- DWT: CYCCNT on + PC sampling (bit12) + PostTap bit10 (bit9=1) +
#           SyncTap CYCCNT[24] (dense) + PostPreset for sample rate ----
# 0x00000C0F = CYCCNTENA | PCSAMPLENA(bit12) | SYNCTAP=01(bit10) |
#              POSTTAP=1(bit9) | POSTPRESET=0 ... build explicitly:
#   bit0 CYCCNTENA=1, bit9 POSTTAP=1, bits[11:10] SYNCTAP=01, bit12 PCSAMPLENA=1
mww 0xE0001FB0 0xC5ACCE55
mww 0xE0001000 0x00001601

echo "DWT_CTRL (expect 0x00001601 = CYCCNT+PCsample+posttap+synctap):"
mdw 0xE0001000
echo "ITM_TCR:"
mdw 0xE0000E80

resume
echo "=== DWT PC-sampling over SWO running. PB3 @ 2 Mbaud NRZ (ITM bypass). ==="

proc pre_shutdown {} {
    catch { resume }
}
